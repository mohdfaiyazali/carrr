{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">Available Cars</h1>
<div class="row g-3">
  {% for car in cars %}
  <div class="col-md-4">
    <div class="card">
      <div class="card-body">
        <h5>{{ car.brand }} {{ car.model }}</h5>
        <p class="mb-2">{{ car.fuel_type }} | {{ car.transmission }}</p>
        <a href="{% url 'car-detail' car.id %}" class="btn btn-primary btn-sm">View</a>
      </div>
    </div>
  </div>
  {% empty %}<p>No cars available.</p>{% endfor %}
</div>
{% endblock %}
